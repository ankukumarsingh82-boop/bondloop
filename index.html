<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BondLoop</title>
<style>body{font-family:system-ui,sans-serif;max-width:800px;margin:2rem auto;padding:0 1rem;background:#fdf2f8;color:#3b0764}.card{background:#fff;padding:1rem;border-radius:12px;margin:1rem 0;box-shadow:0 1px 4px #0001}button,select,textarea{font:inherit;padding:.5rem;border-radius:8px;border:1px solid #e9d5ff}button{background:#a21caf;color:#fff;border:0;cursor:pointer}.banner{background:#fef3c7;padding:.6rem;border-radius:8px}.ice{background:#f5d0fe;padding:.6rem;border-radius:8px;margin:.4rem 0}</style></head><body>
<div class="banner">Prep scaffold for AFFECIO HACKS '26 — final build happens in the official Build Phase (from 21 Oct 2026).</div>
<h1>BondLoop</h1><p>Daily group check-ins with gentle conversation starters for whoever seems quiet.</p>
<div class="card"><h3>Today's prompt</h3><p id="prompt"></p><select id="who"></select><br><br><textarea id="txt" rows="3" style="width:100%" placeholder="One short reflection..."></textarea><br><button id="post">Check in</button></div>
<div class="card"><h3>Icebreakers for quiet members</h3><div id="ice"></div></div>
<div class="card"><h3>Feed</h3><div id="feed"></div><button id="reset" style="background:#64748b">Reset demo</button></div>
<script src="app.js"></script></body></html>
